name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Not 1.3.14: its bun test --isolate leaves modules with a top-level
          # await uninitialised (engine io/BZip2.ts), fixed by 1.4.0.
          bun-version: 1.4.3

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install webclient dependencies
        working-directory: server/webclient
        run: bun install --frozen-lockfile

      - name: Install engine dependencies
        working-directory: server/engine
        run: bun install --frozen-lockfile

      - name: Build game content for compiled-script regression tests
        working-directory: server/engine
        env:
          BUILD_VERIFY: "false"
        run: bun run build

      - name: Type-check, test, and verify generated docs
        run: bun run check
